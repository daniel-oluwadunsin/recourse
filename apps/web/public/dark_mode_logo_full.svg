<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 100" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@700&amp;display=swap');
    </style>
  </defs>
  
  <g transform="translate(10, 0)">
    <!-- 4px Hard Offset Shadow -->
    <path d="M 10 25 C 30 22, 50 25, 55 15 C 70 12, 85 15, 90 20 C 92 40, 88 80, 85 85 C 50 90, 15 85, 12 80 C 10 60, 8 40, 10 25 Z" fill="#2d2d2d" transform="translate(4, 4)" />
    <!-- Back Folder -->
    <path d="M 10 25 C 30 22, 50 25, 55 15 C 70 12, 85 15, 90 20 C 92 40, 88 80, 85 85 C 50 90, 15 85, 12 80 C 10 60, 8 40, 10 25 Z" fill="#e5e0d8" stroke="#2d2d2d" stroke-width="3" stroke-linejoin="round" />
    <!-- Evidence Document -->
    <path d="M 20 10 C 45 8, 70 12, 75 15 C 80 40, 75 75, 72 80 C 45 82, 20 78, 18 75 C 15 50, 18 30, 20 10 Z" fill="#fdfbf7" stroke="#2d2d2d" stroke-width="2.5" stroke-linejoin="round" transform="rotate(3 50 50)" />
    <!-- Squiggles -->
    <path d="M 32 30 C 45 28, 55 32, 65 30 M 30 40 C 50 42, 60 38, 70 40 M 32 50 C 40 48, 50 52, 60 50" stroke="#2d2d2d" stroke-width="2" stroke-linecap="round" fill="none" transform="rotate(3 50 50)" />
    <!-- Front Flap -->
    <path d="M 5 45 C 35 40, 75 42, 95 48 C 92 65, 88 82, 85 85 C 50 92, 15 88, 12 82 C 9 70, 7 55, 5 45 Z" fill="#fdfbf7" stroke="#2d2d2d" stroke-width="3" stroke-linejoin="round" transform="rotate(-1 50 50)" />
    <!-- Red Correction Mark -->
    <path d="M 18 65 C 30 75, 42 68, 52 50 C 65 25, 80 15, 95 8" stroke="#ff4d4d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  
  <!-- Hand-drawn Typography with slight playful rotation -->
  <text x="120" y="70" font-family="'Kalam', cursive" font-weight="700" font-size="64" fill="#2d2d2d" transform="rotate(-2 120 70)">Recourse</text>
</svg>
